<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Internal staff tool holding personal data — keep it out of search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0E1B3D" />
    <title>NBR CRM — National Book of Records</title>
    <!-- The real mark, not a stand-in. This was an inline SVG star drawn
         because no asset was to hand; the logo has been in `public/` since
         before that, so the placeholder was only ever an oversight. Kept as a
         PNG link rather than inlined: it is 34 KB, and a data URI that size in
         the document head delays first paint for an icon nobody sees until the
         tab renders. -->
    <link rel="icon" type="image/png" href="/nbr-logo.png" />
    <link rel="apple-touch-icon" href="/nbr-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
